<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Image Studio Admin</title>
<style>
:root {
  --bg: #f6f4ef;
  --panel: #ffffff;
  --panel-2: #f0eee8;
  --ink: #1e211c;
  --muted: #6c7167;
  --line: #ded8cc;
  --accent: #356b5c;
  --accent-2: #b75d38;
  --danger: #a83c30;
  --ok: #2d7655;
  --shadow: 0 18px 50px rgba(52, 45, 32, .12);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--ink);
  background:
    linear-gradient(180deg, rgba(255,255,255,.58), rgba(255,255,255,0)),
    var(--bg);
}

button,
input {
  font: inherit;
}

button {
  min-height: 40px;
  border: 1px solid var(--line);
  border-radius: 7px;
  padding: 0 14px;
  background: var(--panel);
  color: var(--ink);
  cursor: pointer;
}

button.primary {
  border-color: var(--accent);
  background: var(--accent);
  color: #fff;
}

button:disabled {
  cursor: not-allowed;
  opacity: .55;
}

input {
  width: 100%;
  min-height: 40px;
  border: 1px solid var(--line);
  border-radius: 7px;
  padding: 0 12px;
  background: #fff;
  color: var(--ink);
}

label {
  display: grid;
  gap: 7px;
  color: var(--muted);
  font-size: .78rem;
  font-weight: 650;
}

.shell {
  width: min(1180px, calc(100vw - 32px));
  margin: 0 auto;
  padding: 28px 0 56px;
}

.topbar {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 20px;
  align-items: end;
  margin-bottom: 22px;
}

.eyebrow {
  margin: 0 0 8px;
  color: var(--accent);
  font-size: .72rem;
  font-weight: 750;
  letter-spacing: .12em;
  text-transform: uppercase;
}

h1 {
  margin: 0;
  font-size: clamp(2rem, 4vw, 3.2rem);
  letter-spacing: 0;
  line-height: .98;
}

.token-panel {
  display: grid;
  grid-template-columns: minmax(260px, 420px) auto auto;
  gap: 10px;
  align-items: end;
}

.status-line {
  min-height: 24px;
  margin: 0 0 18px;
  color: var(--muted);
  font-size: .88rem;
}

.status-line.error { color: var(--danger); }
.status-line.ok { color: var(--ok); }

.recent-op {
  display: none;
  margin: 0 0 18px;
  padding: 12px 14px;
  border: 1px solid rgba(45,118,85,.24);
  border-radius: 8px;
  background: rgba(53,107,92,.06);
}

.recent-op.is-visible {
  display: block;
}

.recent-op strong {
  color: var(--ok);
}

.recent-op small {
  display: block;
  margin-top: 6px;
  color: var(--muted);
}

.setup-hint {
  display: none;
  margin: 0 0 18px;
  padding: 14px 16px;
  border: 1px solid rgba(183, 93, 56, .28);
  border-radius: 8px;
  background: rgba(183, 93, 56, .08);
}

.setup-hint.is-visible {
  display: block;
}

.setup-hint strong {
  display: block;
  margin-bottom: 8px;
  color: var(--accent-2);
}

.setup-hint p,
.setup-hint ol {
  margin: 0;
  color: var(--muted);
  line-height: 1.5;
}

.setup-hint ol {
  padding-left: 18px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
  margin-bottom: 16px;
}

.metric {
  min-height: 120px;
  padding: 16px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel);
  box-shadow: var(--shadow);
}

.metric span {
  display: block;
  color: var(--muted);
  font-size: .76rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .08em;
}

.metric strong {
  display: block;
  margin-top: 18px;
  font-size: 2.1rem;
  line-height: 1;
}

.metric small {
  display: block;
  margin-top: 9px;
  color: var(--muted);
  line-height: 1.45;
}

.main {
  display: grid;
  grid-template-columns: minmax(0, 1.4fr) minmax(320px, .8fr);
  gap: 16px;
  align-items: start;
}

.section {
  border: 1px solid var(--line);
  border-radius: 8px;
  background: rgba(255,255,255,.82);
  box-shadow: var(--shadow);
  overflow: hidden;
}

.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 54px;
  padding: 14px 16px;
  border-bottom: 1px solid var(--line);
  background: var(--panel-2);
}

.section-head h2 {
  margin: 0;
  font-size: 1rem;
}

.section-body {
  padding: 16px;
}

.form-grid {
  display: grid;
  gap: 12px;
}

.split {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.table {
  width: 100%;
  border-collapse: collapse;
}

.table th,
.table td {
  padding: 11px 12px;
  border-bottom: 1px solid var(--line);
  text-align: left;
  vertical-align: top;
  font-size: .86rem;
}

.table th {
  color: var(--muted);
  font-size: .72rem;
  letter-spacing: .08em;
  text-transform: uppercase;
}

.table tbody tr:last-child td {
  border-bottom: 0;
}

.table tbody tr.table-row-highlight {
  background: rgba(53,107,92,.08);
}

.table td.balance-highlight {
  color: var(--ok);
  font-weight: 700;
}

.badge {
  display: inline-flex;
  align-items: center;
  min-height: 24px;
  padding: 0 8px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: #fff;
  color: var(--muted);
  font-size: .72rem;
  font-weight: 700;
}

.badge.ok { color: var(--ok); border-color: rgba(45,118,85,.35); }
.badge.warn { color: var(--accent-2); border-color: rgba(183,93,56,.35); }
.badge.bad { color: var(--danger); border-color: rgba(168,60,48,.35); }

.empty {
  padding: 22px;
  color: var(--muted);
  text-align: center;
}

.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

.stack {
  display: grid;
  gap: 16px;
}

.prompt {
  max-width: 440px;
  color: var(--muted);
  line-height: 1.45;
}

.inline-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.inline-actions select {
  min-height: 32px;
  border: 1px solid var(--line);
  border-radius: 7px;
  padding: 0 10px;
  background: #fff;
  color: var(--ink);
}

.audit-detail {
  max-width: 100%;
  white-space: pre-wrap;
  word-break: break-word;
}

.signal-list {
  display: grid;
  gap: 10px;
}

.signal-card {
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: rgba(255,255,255,.9);
}

.signal-card strong {
  display: block;
  margin-bottom: 6px;
  font-size: .92rem;
}

.signal-card small {
  color: var(--muted);
  line-height: 1.45;
}

.copy-btn {
  min-height: 28px;
  padding: 0 10px;
  border-radius: 6px;
  font-size: .78rem;
}

.copy-group {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

@media (max-width: 920px) {
  .topbar,
  .main,
  .token-panel {
    grid-template-columns: 1fr;
  }

  .grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

/* ── API 客户与密钥 ───────────────────────────────── */
.customer-toolbar {
  display: grid;
  grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr) minmax(0, 1.2fr) auto;
  gap: 10px;
  align-items: end;
  padding: 14px 16px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel-2);
  margin-bottom: 16px;
}

.customer-list {
  display: grid;
  gap: 14px;
}

.customer-card {
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #fff;
  box-shadow: 0 10px 30px rgba(52, 45, 32, .07);
  overflow: hidden;
}

.customer-card-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 14px;
  padding: 15px 16px;
  background: linear-gradient(180deg, rgba(53,107,92,.05), rgba(53,107,92,0));
  border-bottom: 1px solid var(--line);
}

.customer-id {
  display: flex;
  align-items: center;
  gap: 9px;
  flex-wrap: wrap;
}

.customer-id strong {
  font-size: 1.04rem;
  letter-spacing: -.01em;
}

.customer-id small {
  display: block;
  margin-top: 5px;
  color: var(--muted);
  font-size: .8rem;
  line-height: 1.4;
}

.customer-wallet {
  flex-shrink: 0;
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.customer-wallet b {
  display: block;
  font-size: 1.5rem;
  line-height: 1;
  color: var(--ok);
}

.customer-wallet span {
  display: block;
  margin-top: 5px;
  color: var(--muted);
  font-size: .72rem;
  text-transform: uppercase;
  letter-spacing: .07em;
}

.customer-body {
  padding: 14px 16px;
}

.key-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 10px;
}

.key-head h3 {
  margin: 0;
  font-size: .78rem;
  font-weight: 750;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--muted);
}

.key-row {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  padding: 10px 0;
  border-top: 1px dashed var(--line);
}

.key-row:first-of-type { border-top: 0; }

.key-row .mono { font-size: .84rem; }

.key-row .key-when {
  color: var(--muted);
  font-size: .76rem;
}

.key-row .spacer { flex: 1 1 auto; }

.key-revoked .mono { text-decoration: line-through; opacity: .6; }

.inline-form {
  display: none;
  gap: 10px;
  margin-top: 12px;
  padding: 13px 14px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel-2);
}

.inline-form.is-open { display: grid; }

.card-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 13px;
  padding-top: 13px;
  border-top: 1px solid var(--line);
}

.btn-sm {
  min-height: 32px;
  padding: 0 12px;
  font-size: .8rem;
  font-weight: 650;
}

.btn-danger {
  border-color: rgba(168,60,48,.4);
  color: var(--danger);
}

.btn-danger:hover { background: rgba(168,60,48,.08); }

/* 一次性密钥揭示弹层 —— 服务端只存哈希,明文仅此一刻可见 */
.reveal-backdrop {
  position: fixed;
  inset: 0;
  display: none;
  place-items: center;
  padding: 20px;
  background: rgba(30, 33, 28, .46);
  backdrop-filter: blur(3px);
  z-index: 40;
}

.reveal-backdrop.is-open { display: grid; }

.reveal-card {
  width: min(540px, 100%);
  border: 1px solid var(--line);
  border-top: 4px solid var(--accent-2);
  border-radius: 12px;
  background: var(--panel);
  box-shadow: 0 30px 80px rgba(52, 45, 32, .32);
  padding: 24px;
  animation: reveal-pop .26s cubic-bezier(.16, 1, .3, 1);
}

@keyframes reveal-pop {
  from { opacity: 0; transform: translateY(12px) scale(.985); }
  to { opacity: 1; transform: none; }
}

.reveal-card .eyebrow { color: var(--accent-2); }

.reveal-card h2 {
  margin: 0 0 6px;
  font-size: 1.3rem;
}

.reveal-warn {
  margin: 0 0 16px;
  color: var(--muted);
  font-size: .86rem;
  line-height: 1.5;
}

.reveal-key {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px;
  border: 1px solid rgba(183,93,56,.35);
  border-radius: 9px;
  background: rgba(183,93,56,.07);
  margin-bottom: 18px;
}

.reveal-key code {
  flex: 1 1 auto;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: .92rem;
  word-break: break-all;
  color: var(--ink);
}

.reveal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
}

@media (max-width: 920px) {
  .customer-toolbar { grid-template-columns: 1fr; }
}

@media (max-width: 560px) {
  .grid,
  .split {
    grid-template-columns: 1fr;
  }

  .table {
    display: block;
    overflow-x: auto;
  }

  .customer-card-head { flex-direction: column; }
  .customer-wallet { text-align: left; }
}
</style>
</head>
<body>
<main class="shell">
  <header class="topbar">
    <div>
      <p class="eyebrow">Operations</p>
      <h1>Image Studio Admin</h1>
    </div>
    <div class="token-panel">
      <label>
        Admin Token
        <input id="adminToken" type="password" autocomplete="off" placeholder="ADMIN_TOKEN" />
      </label>
      <button id="rememberBtn" type="button">本次会话保存</button>
      <button id="refreshBtn" type="button" class="primary">刷新</button>
    </div>
  </header>

  <p id="statusLine" class="status-line">等待连接。</p>
  <div id="setupHint" class="setup-hint" aria-live="polite"></div>
  <div id="recentOp" class="recent-op" aria-live="polite"></div>

  <section class="grid" aria-label="关键指标">
    <div class="metric"><span>Gallery</span><strong id="galleryTotal">-</strong><small id="galleryMeta">生成记录</small></div>
    <div class="metric"><span>Jobs</span><strong id="jobsTotal">-</strong><small id="jobsMeta">任务状态</small></div>
    <div class="metric"><span>Credits</span><strong id="creditsAvailable">-</strong><small id="creditsMeta">可用 / 冻结</small></div>
    <div class="metric"><span>Codes</span><strong id="codesActive">-</strong><small id="codesMeta">可兑换 / 已兑换</small></div>
  </section>

  <div class="main">
    <div class="stack">
      <section class="section">
        <div class="section-head">
          <h2>近期任务</h2>
          <span id="configBadge" class="badge">未连接</span>
        </div>
        <div class="section-body" id="jobsTableWrap">
          <div class="empty">暂无数据</div>
        </div>
      </section>

      <section class="section">
        <div class="section-head">
          <h2>最近异常</h2>
          <span id="errorMeta" class="badge">未加载</span>
        </div>
        <div class="section-body" id="errorSummaryWrap">
          <div class="empty">暂无数据</div>
        </div>
      </section>

      <section class="section">
        <div class="section-head">
          <h2>最近审计记录</h2>
          <div class="inline-actions">
            <select id="auditActionFilter" aria-label="筛选审计动作">
              <option value="">全部动作</option>
              <option value="admin_credits_grant">按 user_token 补偿</option>
              <option value="admin_credits_grant_by_email">按邮箱补偿</option>
              <option value="admin_redemption_batch_create">批量发码</option>
              <option value="admin_redemption_code_revoke">撤销兑换码</option>
            </select>
            <button id="auditRefreshBtn" type="button">刷新审计</button>
            <span id="auditMeta" class="badge">未加载</span>
          </div>
        </div>
        <div class="section-body" id="auditTableWrap">
          <div class="empty">暂无数据</div>
        </div>
      </section>
    </div>

    <aside class="section">
      <div class="section-head">
        <h2>手动补偿</h2>
        <span class="badge warn">admin_grant</span>
      </div>
      <div class="section-body">
        <form id="grantForm" class="form-grid">
          <label>
            User Token
            <input id="grantUserToken" name="user_token" autocomplete="off" placeholder="usr_..." required />
          </label>
          <div class="split">
            <label>
              Credits
              <input id="grantCredits" name="credits" type="number" min="1" max="10000" step="1" inputmode="numeric" required />
            </label>
            <label>
              Note
              <input id="grantNote" name="note" maxlength="200" placeholder="support adjustment" />
            </label>
          </div>
          <button id="grantBtn" type="submit" class="primary">补偿 credits</button>
        </form>
        <form id="grantEmailForm" class="form-grid" style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line);">
          <label>
            Email
            <input id="grantEmail" name="email" autocomplete="off" placeholder="user@example.com" required />
          </label>
          <div class="split">
            <label>
              Credits
              <input id="grantEmailCredits" name="credits" type="number" min="1" max="10000" step="1" inputmode="numeric" required />
            </label>
            <label>
              Note
              <input id="grantEmailNote" name="note" maxlength="200" placeholder="support adjustment by email" />
            </label>
          </div>
          <button id="grantEmailBtn" type="submit">按邮箱补偿</button>
        </form>
      </div>
    </aside>
  </div>

  <section class="section" style="margin-top: 16px;">
    <div class="section-head">
      <h2>邮箱用户</h2>
      <span id="emailUsersMeta" class="badge">未加载</span>
    </div>
    <div class="section-body">
      <div class="split" style="margin-bottom: 12px;">
        <label>
          检索邮箱
          <input id="emailUsersQuery" type="text" placeholder="输入邮箱关键字，例如 alpha" />
        </label>
        <div style="display:flex;align-items:flex-end;gap:8px;">
          <button id="emailUsersSearchBtn" type="button" class="primary">查询</button>
        </div>
      </div>
      <div id="emailUsersTableWrap" class="empty">暂无数据</div>
    </div>
  </section>

  <section class="section" style="margin-top: 16px;">
    <div class="section-head">
      <h2>API 客户与密钥</h2>
      <span id="customersMeta" class="badge">未加载</span>
    </div>
    <div class="section-body">
      <form id="customerCreateForm" class="customer-toolbar">
        <label>
          客户名称
          <input id="customerName" name="name" maxlength="120" placeholder="例如 Acme Studio" required />
        </label>
        <label>
          联系方式
          <input id="customerContact" name="contact" maxlength="200" placeholder="可选，邮箱/微信" />
        </label>
        <label>
          备注
          <input id="customerNote" name="note" maxlength="200" placeholder="可选，用途说明" />
        </label>
        <button id="customerCreateBtn" type="submit" class="primary">创建客户</button>
      </form>
      <div id="customersWrap" class="empty">暂无数据</div>
    </div>
  </section>
</main>

<div id="revealBackdrop" class="reveal-backdrop" role="dialog" aria-modal="true" aria-labelledby="revealTitle">
  <div class="reveal-card">
    <p class="eyebrow">API Key 已签发</p>
    <h2 id="revealTitle">请立即复制密钥</h2>
    <p class="reveal-warn">这是该密钥唯一一次完整显示。服务端只保存哈希值，关闭后将无法再次查看。如丢失只能吊销后重新签发。</p>
    <div class="reveal-key">
      <code id="revealKey" class="mono">gim_...</code>
      <button id="revealCopyBtn" type="button" class="primary btn-sm">复制</button>
    </div>
    <div class="reveal-actions">
      <button id="revealCloseBtn" type="button">我已保存，关闭</button>
    </div>
  </div>
</div>

<script>
const tokenInput = document.getElementById('adminToken');
const rememberBtn = document.getElementById('rememberBtn');
const refreshBtn = document.getElementById('refreshBtn');
const statusLine = document.getElementById('statusLine');
const setupHint = document.getElementById('setupHint');
const recentOp = document.getElementById('recentOp');
const grantForm = document.getElementById('grantForm');
const grantBtn = document.getElementById('grantBtn');
const grantEmailForm = document.getElementById('grantEmailForm');
const grantEmailBtn = document.getElementById('grantEmailBtn');
const jobsTableWrap = document.getElementById('jobsTableWrap');
const errorMeta = document.getElementById('errorMeta');
const errorSummaryWrap = document.getElementById('errorSummaryWrap');
const auditActionFilter = document.getElementById('auditActionFilter');
const auditRefreshBtn = document.getElementById('auditRefreshBtn');
const auditMeta = document.getElementById('auditMeta');
const auditTableWrap = document.getElementById('auditTableWrap');
const emailUsersMeta = document.getElementById('emailUsersMeta');
const emailUsersQuery = document.getElementById('emailUsersQuery');
const emailUsersSearchBtn = document.getElementById('emailUsersSearchBtn');
const emailUsersTableWrap = document.getElementById('emailUsersTableWrap');
const customersMeta = document.getElementById('customersMeta');
const customerCreateForm = document.getElementById('customerCreateForm');
const customerCreateBtn = document.getElementById('customerCreateBtn');
const customersWrap = document.getElementById('customersWrap');
const revealBackdrop = document.getElementById('revealBackdrop');
const revealKey = document.getElementById('revealKey');
const revealCopyBtn = document.getElementById('revealCopyBtn');
const revealCloseBtn = document.getElementById('revealCloseBtn');

const metricEls = {
  galleryTotal: document.getElementById('galleryTotal'),
  galleryMeta: document.getElementById('galleryMeta'),
  jobsTotal: document.getElementById('jobsTotal'),
  jobsMeta: document.getElementById('jobsMeta'),
  creditsAvailable: document.getElementById('creditsAvailable'),
  creditsMeta: document.getElementById('creditsMeta'),
  codesActive: document.getElementById('codesActive'),
  codesMeta: document.getElementById('codesMeta'),
  configBadge: document.getElementById('configBadge'),
};

let recentOperation = null;

tokenInput.value = sessionStorage.getItem('adminToken') || '';

function setStatus(message, type = '') {
  statusLine.textContent = message;
  statusLine.className = `status-line ${type}`.trim();
}

function renderSetupHint(config = null) {
  if (!setupHint) return;
  if (!config) {
    setupHint.className = 'setup-hint';
    setupHint.innerHTML = '';
    return;
  }

  const steps = Array.isArray(config.steps) ? config.steps : [];
  const body = steps.length > 0
    ? `<ol>${steps.map((step) => `<li>${escapeHtml(step)}</li>`).join('')}</ol>`
    : `<p>${escapeHtml(config.message || '')}</p>`;
  setupHint.className = 'setup-hint is-visible';
  setupHint.innerHTML = `<strong>${escapeHtml(config.title || '需要配置')}</strong>${body}`;
}

function getAdminToken() {
  return tokenInput.value.trim();
}

function authHeaders() {
  return {
    'x-admin-token': getAdminToken(),
  };
}

async function api(path, options = {}) {
  const headers = {
    ...authHeaders(),
    ...(options.headers || {}),
  };
  const res = await fetch(path, { ...options, headers });
  const body = await res.json().catch(() => null);
  if (!res.ok || !body || body.success === false) {
    const message = body && body.error ? body.error.message : `request failed ${res.status}`;
    const error = new Error(message);
    error.code = body && body.error ? body.error.code : '';
    error.status = res.status;
    throw error;
  }
  return body.data;
}

function formatNumber(value) {
  return Number(value || 0).toLocaleString('zh-CN');
}

function renderRecentOperation() {
  if (!recentOp) return;
  if (!recentOperation) {
    recentOp.className = 'recent-op';
    recentOp.innerHTML = '';
    return;
  }

  const targetLabel = recentOperation.email
    ? `邮箱 ${escapeHtml(recentOperation.email)}`
    : `钱包 ${escapeHtml(recentOperation.userToken || '-')}`;
  const createdHint = recentOperation.createdUserToken
    ? `已自动创建钱包 token：${escapeHtml(recentOperation.createdUserToken)}`
    : '使用现有钱包完成补偿。';
  recentOp.className = 'recent-op is-visible';
  recentOp.innerHTML = `
    <div>最近操作：已向 <strong>${targetLabel}</strong> 补偿 <strong>${formatNumber(recentOperation.creditsAdded)}</strong> credits，当前可用余额 <strong>${formatNumber(recentOperation.availableCredits)}</strong>。</div>
    <small>${createdHint} · ${escapeHtml(new Date(recentOperation.at).toLocaleString('zh-CN'))}</small>
  `;
}

function statusClass(status) {
  const normalized = String(status || 'unknown');
  if (normalized === 'succeeded') return 'ok';
  if (['failed', 'canceled', 'timed_out'].includes(normalized)) return 'bad';
  return 'warn';
}

function renderJobs(jobs) {
  if (!jobs || jobs.length === 0) {
    jobsTableWrap.innerHTML = '<div class="empty">暂无任务</div>';
    return;
  }

  const rows = jobs.map((job) => `
    <tr>
      <td><span class="badge ${statusClass(job.status)}">${escapeHtml(job.status || 'unknown')}</span></td>
      <td class="mono">${escapeHtml(job.job_id || '-')}</td>
      <td><div class="prompt">${escapeHtml(job.prompt || '-')}</div></td>
      <td>${escapeHtml(job.size || '-')}</td>
      <td>${escapeHtml(job.updated_at ? new Date(job.updated_at).toLocaleString('zh-CN') : '-')}</td>
    </tr>
  `).join('');

  jobsTableWrap.innerHTML = `
    <table class="table">
      <thead>
        <tr><th>状态</th><th>Job</th><th>Prompt</th><th>尺寸</th><th>更新</th></tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

function renderErrorSummary(metrics) {
  if (!metrics || typeof metrics !== 'object') {
    errorSummaryWrap.innerHTML = '<div class="empty">暂无错误数据</div>';
    errorMeta.textContent = '未加载';
    errorMeta.className = 'badge';
    return;
  }

  const totalErrors = Number(metrics.errors_total || 0);
  const totalRequests = Number(metrics.requests_total || 0);
  const topCodes = Object.entries(metrics.error_codes || {})
    .sort((left, right) => right[1] - left[1])
    .slice(0, 3);
  const topPaths = Object.entries(metrics.by_path || {})
    .sort((left, right) => right[1] - left[1])
    .slice(0, 3);

  if (totalErrors === 0) {
    errorSummaryWrap.innerHTML = '<div class="empty">当前没有累计错误，运行状态正常。</div>';
    errorMeta.textContent = `错误 0 / 请求 ${formatNumber(totalRequests)}`;
    errorMeta.className = 'badge ok';
    return;
  }

  const codeItems = topCodes.length > 0
    ? topCodes.map(([code, count]) => `<div class="signal-card"><strong>${escapeHtml(code)}</strong><small>累计 ${formatNumber(count)} 次</small></div>`).join('')
    : '<div class="signal-card"><strong>暂无错误码</strong><small>还没有可展示的错误码聚合。</small></div>';
  const pathItems = topPaths.length > 0
    ? topPaths.map(([pathKey, count]) => `<div class="signal-card"><strong class="mono">${escapeHtml(pathKey)}</strong><small>累计 ${formatNumber(count)} 次请求，可结合错误码排查。</small></div>`).join('')
    : '<div class="signal-card"><strong>暂无路径统计</strong><small>还没有可展示的路径聚合。</small></div>';

  errorSummaryWrap.innerHTML = `
    <div class="signal-list">
      <div class="signal-card">
        <strong>累计错误 ${formatNumber(totalErrors)}</strong>
        <small>总请求 ${formatNumber(totalRequests)}。优先关注下方高频错误码和高频请求路径。</small>
      </div>
      ${codeItems}
      ${pathItems}
    </div>
  `;
  errorMeta.textContent = `错误 ${formatNumber(totalErrors)} / 请求 ${formatNumber(totalRequests)}`;
  errorMeta.className = 'badge bad';
}

function renderAuditLogs(entries, total) {
  if (!entries || entries.length === 0) {
    auditTableWrap.innerHTML = '<div class="empty">暂无审计记录</div>';
    auditMeta.textContent = '最近 0 条';
    auditMeta.className = 'badge';
    return;
  }

  const rows = entries.map((entry) => {
    const detailText = escapeHtml(JSON.stringify(entry.detail || {}, null, 2));
    const requestId = String(entry.request_id || '-');
    const rawDetail = JSON.stringify(entry.detail || {}, null, 2);
    return `
      <tr>
        <td><span class="badge ${statusClass(entry.action)}">${escapeHtml(entry.action || '-')}</span></td>
        <td>
          <div class="copy-group">
            <span class="mono">${escapeHtml(requestId)}</span>
            <button class="copy-btn" type="button" data-copy="${escapeHtml(requestId)}" data-copy-label="request_id">复制</button>
          </div>
        </td>
        <td>${escapeHtml(entry.ts ? new Date(entry.ts).toLocaleString('zh-CN') : '-')}</td>
        <td>
          <div class="prompt mono audit-detail">${detailText}</div>
          <button class="copy-btn" type="button" data-copy="${escapeHtml(rawDetail)}" data-copy-label="detail">复制明细</button>
        </td>
      </tr>
    `;
  }).join('');

  auditTableWrap.innerHTML = `
    <table class="table">
      <thead>
        <tr><th>动作</th><th>Request</th><th>时间</th><th>Detail</th></tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  `;
  auditMeta.textContent = `最近 ${formatNumber(total)} 条`;
  auditMeta.className = 'badge ok';
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, (char) => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;',
  }[char]));
}

async function copyText(value) {
  const text = String(value || '');
  if (!text) return false;

  if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
    await navigator.clipboard.writeText(text);
    return true;
  }

  const textarea = document.createElement('textarea');
  textarea.value = text;
  textarea.setAttribute('readonly', 'readonly');
  textarea.style.position = 'absolute';
  textarea.style.left = '-9999px';
  document.body.appendChild(textarea);
  textarea.select();
  const ok = document.execCommand('copy');
  document.body.removeChild(textarea);
  return ok;
}

function renderOverview(data) {
  metricEls.galleryTotal.textContent = formatNumber(data.gallery.total);
  metricEls.galleryMeta.textContent = `最近 ${formatNumber(data.gallery.recent.length)} 条`;
  metricEls.jobsTotal.textContent = formatNumber(data.jobs.total);
  metricEls.jobsMeta.textContent = Object.entries(data.jobs.by_status || {}).map(([key, value]) => `${key} ${value}`).join(' / ') || '暂无任务';
  metricEls.creditsAvailable.textContent = formatNumber(data.credits.available_credits);
  metricEls.creditsMeta.textContent = `冻结 ${formatNumber(data.credits.reserved_credits)} / 账本 ${formatNumber(data.credits.ledger_entries)}`;
  metricEls.codesActive.textContent = formatNumber(data.credits.codes.active);
  metricEls.codesMeta.textContent = `已兑换 ${formatNumber(data.credits.codes.redeemed)} / 总数 ${formatNumber(data.credits.codes.total)}`;
  metricEls.configBadge.textContent = `${data.config.provider} · ${data.config.image_storage_provider}`;
  metricEls.configBadge.className = data.config.has_required_env ? 'badge ok' : 'badge bad';
  renderJobs(data.jobs.recent || []);
}

function renderEmailUsers(users, total) {
  if (!users || users.length === 0) {
    emailUsersTableWrap.innerHTML = '<div class="empty">暂无邮箱用户</div>';
    return;
  }

  const rows = users.map((user) => {
    const isRecent = Boolean(recentOperation && recentOperation.email && recentOperation.email === user.email);
    return `
    <tr class="${isRecent ? 'table-row-highlight' : ''}">
      <td class="mono">${escapeHtml(user.id || '-')}</td>
      <td>${escapeHtml(user.email || '-')}</td>
      <td>${escapeHtml(user.status || 'active')}</td>
      <td>${user.wallet && user.wallet.linked ? `<span class="badge ok">已关联</span>` : `<span class="badge">未关联</span>`}</td>
      <td class="${isRecent ? 'balance-highlight' : ''}">${escapeHtml(user.wallet ? `${formatNumber(user.wallet.available_credits || 0)} / ${formatNumber(user.wallet.reserved_credits || 0)}` : '0 / 0')}</td>
      <td>${escapeHtml(user.last_login_at ? new Date(user.last_login_at).toLocaleString('zh-CN') : '-')}</td>
      <td>${escapeHtml(user.email_verified_at ? new Date(user.email_verified_at).toLocaleString('zh-CN') : '-')}</td>
    </tr>
  `;
  }).join('');

  emailUsersTableWrap.innerHTML = `
    <table class="table">
      <thead>
        <tr><th>ID</th><th>邮箱</th><th>状态</th><th>钱包</th><th>余额(可用/冻结)</th><th>最近登录</th><th>验证时间</th></tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  `;
  emailUsersMeta.textContent = `共 ${formatNumber(total)} 人`;
  emailUsersMeta.className = 'badge ok';
}

async function loadEmailUsers() {
  if (!getAdminToken()) {
    emailUsersMeta.textContent = '需要 token';
    emailUsersMeta.className = 'badge bad';
    emailUsersTableWrap.innerHTML = '<div class="empty">请输入 ADMIN_TOKEN</div>';
    return;
  }

  emailUsersSearchBtn.disabled = true;
  const query = emailUsersQuery.value.trim();
  try {
    const data = await api(`/api/admin/email-users?limit=50&q=${encodeURIComponent(query)}`);
    renderEmailUsers(data.users || [], data.total || 0);
  } catch (err) {
    if (String(err.message || '').includes('email auth is not enabled')) {
      emailUsersMeta.textContent = '邮箱认证未启用';
      emailUsersMeta.className = 'badge warn';
      emailUsersTableWrap.innerHTML = '<div class="empty">当前环境未启用邮箱认证。</div>';
      return;
    }
    emailUsersMeta.textContent = '加载失败';
    emailUsersMeta.className = 'badge bad';
    emailUsersTableWrap.innerHTML = `<div class="empty">${escapeHtml(err.message)}</div>`;
  } finally {
    emailUsersSearchBtn.disabled = false;
  }
}

async function loadAuditLogs() {
  if (!getAdminToken()) {
    auditMeta.textContent = '需要 token';
    auditMeta.className = 'badge bad';
    auditTableWrap.innerHTML = '<div class="empty">请输入 ADMIN_TOKEN</div>';
    return;
  }

  auditRefreshBtn.disabled = true;
  try {
    const action = auditActionFilter && auditActionFilter.value ? `&action=${encodeURIComponent(auditActionFilter.value)}` : '';
    const data = await api(`/api/admin/audit-logs?limit=12${action}`);
    renderAuditLogs(data.entries || [], data.total || 0);
  } catch (err) {
    auditMeta.textContent = '加载失败';
    auditMeta.className = 'badge bad';
    auditTableWrap.innerHTML = `<div class="empty">${escapeHtml(err.message)}</div>`;
  } finally {
    auditRefreshBtn.disabled = false;
  }
}

async function loadMetrics() {
  if (!getAdminToken()) {
    errorMeta.textContent = '需要 token';
    errorMeta.className = 'badge bad';
    errorSummaryWrap.innerHTML = '<div class="empty">请输入 ADMIN_TOKEN</div>';
    return;
  }

  try {
    const data = await api('/api/admin/metrics');
    renderErrorSummary(data);
  } catch (err) {
    errorMeta.textContent = '加载失败';
    errorMeta.className = 'badge bad';
    errorSummaryWrap.innerHTML = `<div class="empty">${escapeHtml(err.message)}</div>`;
  }
}

async function loadOverview() {
  if (!getAdminToken()) {
    setStatus('需要 ADMIN_TOKEN。', 'error');
    renderSetupHint({
      title: '先输入管理员 token',
      steps: [
        '在项目根目录的 .env 中设置 ADMIN_TOKEN=一个强随机值',
        '重启 npm run dev',
        '把同一个 ADMIN_TOKEN 填到本页输入框后再刷新',
      ],
    });
    return;
  }
  refreshBtn.disabled = true;
  setStatus('刷新中...');
  renderSetupHint();
  try {
    const data = await api('/api/admin/overview');
    renderOverview(data);
    await loadMetrics();
    await loadAuditLogs();
    await loadEmailUsers();
    await loadCustomers();
    setStatus(`已刷新 ${new Date().toLocaleTimeString('zh-CN')}`, 'ok');
  } catch (err) {
    if (err.code === 'admin_not_configured') {
      renderSetupHint({
        title: '后台未配置 ADMIN_TOKEN',
        steps: [
          '在 .env 中设置 ADMIN_TOKEN=一个强随机值',
          '重启 npm run dev 让服务重新加载环境变量',
          '把相同的 token 输入到本页后点击刷新',
        ],
      });
      metricEls.configBadge.textContent = '未配置';
      metricEls.configBadge.className = 'badge bad';
      errorMeta.textContent = '未配置';
      errorMeta.className = 'badge bad';
      auditMeta.textContent = '未配置';
      auditMeta.className = 'badge bad';
      emailUsersMeta.textContent = '未配置';
      emailUsersMeta.className = 'badge bad';
    }
    setStatus(err.message, 'error');
  } finally {
    refreshBtn.disabled = false;
  }
}

rememberBtn.addEventListener('click', () => {
  const token = getAdminToken();
  if (!token) {
    sessionStorage.removeItem('adminToken');
    setStatus('已清空 token。');
    return;
  }
  sessionStorage.setItem('adminToken', token);
  setStatus('已保存到本次浏览器会话。', 'ok');
});

renderRecentOperation();

refreshBtn.addEventListener('click', loadOverview);
auditRefreshBtn.addEventListener('click', loadAuditLogs);
auditActionFilter.addEventListener('change', loadAuditLogs);
auditTableWrap.addEventListener('click', async (event) => {
  const button = event.target && typeof event.target.closest === 'function'
    ? event.target.closest('button[data-copy]')
    : null;
  if (!button) return;

  const value = button.getAttribute('data-copy') || '';
  const label = button.getAttribute('data-copy-label') || '内容';
  try {
    const ok = await copyText(value);
    if (!ok) throw new Error('copy failed');
    setStatus(`已复制 ${label}。`, 'ok');
  } catch (err) {
    setStatus(`复制 ${label} 失败，请手动复制。`, 'error');
  }
});
emailUsersSearchBtn.addEventListener('click', loadEmailUsers);
emailUsersQuery.addEventListener('keydown', (event) => {
  if (event.key === 'Enter') {
    event.preventDefault();
    loadEmailUsers();
  }
});

grantForm.addEventListener('submit', async (event) => {
  event.preventDefault();
  if (!getAdminToken()) {
    setStatus('需要 ADMIN_TOKEN。', 'error');
    return;
  }

  const userToken = document.getElementById('grantUserToken').value.trim();
  const credits = Number(document.getElementById('grantCredits').value);
  const note = document.getElementById('grantNote').value.trim();
  if (!/^usr_[A-Za-z0-9_-]{20,}$/.test(userToken)) {
    setStatus('User Token 格式无效。', 'error');
    return;
  }
  if (!Number.isInteger(credits) || credits < 1 || credits > 10000) {
    setStatus('Credits 必须是 1 到 10000 的整数。', 'error');
    return;
  }
  grantBtn.disabled = true;
  setStatus('提交补偿中...');
  try {
    const data = await api('/api/admin/credits/grant', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ user_token: userToken, credits, note }),
    });
    recentOperation = {
      userToken,
      email: null,
      creditsAdded: data.credits_added,
      availableCredits: data.wallet.available_credits,
      createdUserToken: null,
      at: Date.now(),
    };
    renderRecentOperation();
    setStatus(`已补偿 ${data.credits_added} credits，可用余额 ${data.wallet.available_credits}。`, 'ok');
    await loadOverview();
    grantForm.reset();
  } catch (err) {
    setStatus(err.message, 'error');
  } finally {
    grantBtn.disabled = false;
  }
});

grantEmailForm.addEventListener('submit', async (event) => {
  event.preventDefault();
  if (!getAdminToken()) {
    setStatus('需要 ADMIN_TOKEN。', 'error');
    return;
  }

  const email = document.getElementById('grantEmail').value.trim().toLowerCase();
  const credits = Number(document.getElementById('grantEmailCredits').value);
  const note = document.getElementById('grantEmailNote').value.trim();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    setStatus('Email 格式无效。', 'error');
    return;
  }
  if (!Number.isInteger(credits) || credits < 1 || credits > 10000) {
    setStatus('Credits 必须是 1 到 10000 的整数。', 'error');
    return;
  }

  grantEmailBtn.disabled = true;
  setStatus('按邮箱补偿中...');
  try {
    const data = await api('/api/admin/credits/grant-by-email', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ email, credits, note }),
    });
    recentOperation = {
      userToken: data.created_user_token || null,
      email: data.email,
      creditsAdded: data.credits_added,
      availableCredits: data.wallet.available_credits,
      createdUserToken: data.created_user_token || null,
      at: Date.now(),
    };
    emailUsersQuery.value = data.email;
    renderRecentOperation();
    const createdHint = data.wallet_user_created && data.created_user_token
      ? `（已创建钱包 user_token: ${data.created_user_token}）`
      : '';
    setStatus(`已向 ${data.email} 补偿 ${data.credits_added} credits，可用余额 ${data.wallet.available_credits}。${createdHint}`, 'ok');
    await loadOverview();
    grantEmailForm.reset();
  } catch (err) {
    setStatus(err.message, 'error');
  } finally {
    grantEmailBtn.disabled = false;
  }
});

function keyStatusBadge(status) {
  const s = String(status || 'active');
  if (s === 'active') return '<span class="badge ok">active</span>';
  if (s === 'revoked') return '<span class="badge bad">revoked</span>';
  return `<span class="badge warn">${escapeHtml(s)}</span>`;
}

function renderKeyRow(key) {
  const created = key.created_at ? new Date(key.created_at).toLocaleString('zh-CN') : '-';
  const lastUsed = key.last_used_at ? new Date(key.last_used_at).toLocaleString('zh-CN') : '尚未使用';
  const expires = key.expires_at ? `· 到期 ${new Date(key.expires_at).toLocaleDateString('zh-CN')}` : '';
  const isActive = String(key.status) === 'active';
  const revokeBtn = isActive
    ? `<button class="btn-sm btn-danger" type="button" data-revoke="${escapeHtml(key.id)}">吊销</button>`
    : '';
  return `
    <div class="key-row ${isActive ? '' : 'key-revoked'}">
      <span class="mono">${escapeHtml(key.key_prefix || '')}…</span>
      ${keyStatusBadge(key.status)}
      <span class="key-when">创建 ${escapeHtml(created)} · 最近使用 ${escapeHtml(lastUsed)} ${expires}</span>
      <span class="spacer"></span>
      ${revokeBtn}
    </div>
  `;
}

function renderCustomerCard(customer) {
  const keys = Array.isArray(customer.api_keys) ? customer.api_keys : [];
  const activeKeys = keys.filter((k) => String(k.status) === 'active').length;
  const wallet = customer.wallet || { available_credits: 0, reserved_credits: 0 };
  const keyRows = keys.length > 0
    ? keys.map(renderKeyRow).join('')
    : '<div class="empty" style="padding:14px;">还没有密钥，点击下方「签发密钥」。</div>';
  const cid = escapeHtml(customer.id);
  return `
    <article class="customer-card" data-customer="${cid}">
      <div class="customer-card-head">
        <div class="customer-id">
          <div>
            <strong>${escapeHtml(customer.name || '未命名客户')}</strong>
            ${customer.status === 'active' ? '<span class="badge ok">active</span>' : `<span class="badge">${escapeHtml(customer.status || '-')}</span>`}
            <small>${escapeHtml(customer.contact || '无联系方式')}${customer.note ? ' · ' + escapeHtml(customer.note) : ''}</small>
            <small class="mono">${cid}</small>
          </div>
        </div>
        <div class="customer-wallet">
          <b>${formatNumber(wallet.available_credits)}</b>
          <span>可用 · 冻结 ${formatNumber(wallet.reserved_credits)}</span>
        </div>
      </div>
      <div class="customer-body">
        <div class="key-head">
          <h3>API 密钥（${activeKeys} 个有效 / 共 ${keys.length}）</h3>
        </div>
        ${keyRows}
        <form class="inline-form" data-form="issue" data-customer="${cid}">
          <div class="split">
            <label>密钥备注<input name="note" maxlength="200" placeholder="可选，用途" /></label>
            <label>到期时间<input name="expires_at" type="date" /></label>
          </div>
          <button type="submit" class="primary btn-sm">确认签发</button>
        </form>
        <form class="inline-form" data-form="grant" data-customer="${cid}">
          <div class="split">
            <label>充值 credits<input name="credits" type="number" min="1" max="10000" step="1" inputmode="numeric" placeholder="1 - 10000" /></label>
            <label>备注<input name="note" maxlength="200" placeholder="可选" /></label>
          </div>
          <button type="submit" class="primary btn-sm">确认充值</button>
        </form>
        <div class="card-actions">
          <button class="btn-sm" type="button" data-toggle="issue" data-customer="${cid}">签发密钥</button>
          <button class="btn-sm" type="button" data-toggle="grant" data-customer="${cid}">充值 credits</button>
        </div>
      </div>
    </article>
  `;
}

function renderCustomers(customers) {
  if (!customers || customers.length === 0) {
    customersWrap.innerHTML = '<div class="empty">还没有 API 客户，使用上方表单创建第一个。</div>';
    customersMeta.textContent = '共 0 个';
    customersMeta.className = 'badge';
    return;
  }
  customersWrap.innerHTML = `<div class="customer-list">${customers.map(renderCustomerCard).join('')}</div>`;
  customersMeta.textContent = `共 ${formatNumber(customers.length)} 个`;
  customersMeta.className = 'badge ok';
}

async function loadCustomers() {
  if (!getAdminToken()) {
    customersMeta.textContent = '需要 token';
    customersMeta.className = 'badge bad';
    customersWrap.innerHTML = '<div class="empty">请输入 ADMIN_TOKEN</div>';
    return;
  }
  try {
    const data = await api('/api/admin/api-customers');
    renderCustomers(data.customers || []);
  } catch (err) {
    if (err.code === 'credits_disabled') {
      customersMeta.textContent = '计费未启用';
      customersMeta.className = 'badge warn';
      customersWrap.innerHTML = '<div class="empty">当前环境未启用计费（CREDITS_ENABLED），无法管理 API 客户。</div>';
      return;
    }
    customersMeta.textContent = '加载失败';
    customersMeta.className = 'badge bad';
    customersWrap.innerHTML = `<div class="empty">${escapeHtml(err.message)}</div>`;
  }
}

function openReveal(secret) {
  revealKey.textContent = secret;
  revealBackdrop.classList.add('is-open');
  revealCopyBtn.focus();
}

function closeReveal() {
  revealBackdrop.classList.remove('is-open');
  revealKey.textContent = 'gim_...';
}

revealCopyBtn.addEventListener('click', async () => {
  try {
    const ok = await copyText(revealKey.textContent);
    if (!ok) throw new Error('copy failed');
    setStatus('API key 已复制到剪贴板。', 'ok');
  } catch (err) {
    setStatus('复制失败，请手动选中复制。', 'error');
  }
});
revealCloseBtn.addEventListener('click', closeReveal);
revealBackdrop.addEventListener('click', (event) => {
  if (event.target === revealBackdrop) closeReveal();
});
document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape' && revealBackdrop.classList.contains('is-open')) closeReveal();
});

customerCreateForm.addEventListener('submit', async (event) => {
  event.preventDefault();
  if (!getAdminToken()) {
    setStatus('需要 ADMIN_TOKEN。', 'error');
    return;
  }
  const name = document.getElementById('customerName').value.trim();
  const contact = document.getElementById('customerContact').value.trim();
  const note = document.getElementById('customerNote').value.trim();
  if (!name) {
    setStatus('客户名称不能为空。', 'error');
    return;
  }
  customerCreateBtn.disabled = true;
  setStatus('创建客户中...');
  try {
    const customer = await api('/api/admin/api-customers', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ name, contact, note }),
    });
    setStatus(`已创建客户 ${customer.name}。`, 'ok');
    customerCreateForm.reset();
    await loadCustomers();
  } catch (err) {
    setStatus(err.message, 'error');
  } finally {
    customerCreateBtn.disabled = false;
  }
});

async function issueKey(customerId, form) {
  const note = form.elements.note.value.trim();
  const expiresRaw = form.elements.expires_at.value;
  const body = { note };
  if (expiresRaw) {
    // <input type="date"> 给出本地日期,转成 UTC 当天 23:59:59 的 ISO,确保是未来时刻
    const parsed = new Date(`${expiresRaw}T23:59:59`);
    if (Number.isNaN(parsed.getTime()) || parsed.getTime() <= Date.now()) {
      setStatus('到期时间必须是未来的日期。', 'error');
      return;
    }
    body.expires_at = parsed.toISOString();
  }
  const submitBtn = form.querySelector('button[type="submit"]');
  submitBtn.disabled = true;
  setStatus('签发密钥中...');
  try {
    const result = await api(`/api/admin/api-customers/${encodeURIComponent(customerId)}/api-keys`, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(body),
    });
    openReveal(result.api_key);
    setStatus('密钥已签发，请在弹窗中复制。', 'ok');
    await loadCustomers();
  } catch (err) {
    setStatus(err.message, 'error');
  } finally {
    submitBtn.disabled = false;
  }
}

async function grantToCustomer(customerId, form) {
  const credits = Number(form.elements.credits.value);
  const note = form.elements.note.value.trim();
  if (!Number.isInteger(credits) || credits < 1 || credits > 10000) {
    setStatus('Credits 必须是 1 到 10000 的整数。', 'error');
    return;
  }
  const submitBtn = form.querySelector('button[type="submit"]');
  submitBtn.disabled = true;
  setStatus('充值中...');
  try {
    const data = await api(`/api/admin/api-customers/${encodeURIComponent(customerId)}/credits/grant`, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ credits, note }),
    });
    setStatus(`已充值 ${data.credits_added} credits，可用余额 ${data.wallet.available_credits}。`, 'ok');
    await loadCustomers();
  } catch (err) {
    setStatus(err.message, 'error');
  } finally {
    submitBtn.disabled = false;
  }
}

async function revokeKey(keyId, trigger) {
  if (!window.confirm('确定吊销该密钥？吊销后使用该 key 的请求将立即失败，且不可恢复。')) return;
  trigger.disabled = true;
  setStatus('吊销密钥中...');
  try {
    await api(`/api/admin/api-keys/${encodeURIComponent(keyId)}/revoke`, { method: 'POST' });
    setStatus('密钥已吊销。', 'ok');
    await loadCustomers();
  } catch (err) {
    setStatus(err.message, 'error');
    trigger.disabled = false;
  }
}

customersWrap.addEventListener('click', (event) => {
  const target = event.target;
  if (!target || typeof target.closest !== 'function') return;

  const toggle = target.closest('button[data-toggle]');
  if (toggle) {
    const kind = toggle.getAttribute('data-toggle');
    const cid = toggle.getAttribute('data-customer');
    const form = customersWrap.querySelector(`form[data-form="${kind}"][data-customer="${CSS.escape(cid)}"]`);
    if (form) {
      const willOpen = !form.classList.contains('is-open');
      const card = toggle.closest('.customer-card');
      card.querySelectorAll('.inline-form.is-open').forEach((f) => f.classList.remove('is-open'));
      if (willOpen) form.classList.add('is-open');
    }
    return;
  }

  const revoke = target.closest('button[data-revoke]');
  if (revoke) {
    revokeKey(revoke.getAttribute('data-revoke'), revoke);
  }
});

customersWrap.addEventListener('submit', (event) => {
  const form = event.target;
  if (!form || form.tagName !== 'FORM') return;
  event.preventDefault();
  if (!getAdminToken()) {
    setStatus('需要 ADMIN_TOKEN。', 'error');
    return;
  }
  const kind = form.getAttribute('data-form');
  const cid = form.getAttribute('data-customer');
  if (kind === 'issue') issueKey(cid, form);
  else if (kind === 'grant') grantToCustomer(cid, form);
});

if (getAdminToken()) {
  loadOverview();
}</script>
</body>
</html>
